name: Publish Nexus Mods Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: GitHub release tag to upload
        required: true

permissions:
  contents: read

jobs:
  upload:
    name: Upload release asset to Nexus Mods
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Resolve release metadata
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            tag="${{ github.event.release.tag_name }}"
          else
            tag="${{ inputs.tag_name }}"
          fi

          if [[ -z "$tag" ]]; then
            echo "Release tag is required." >&2
            exit 1
          fi

          version="${tag#v}"
          version="${version#V}"
          release_url="$(gh release view "$tag" --repo "${{ github.repository }}" --json url --jq '.url')"
          release_body="$(gh release view "$tag" --repo "${{ github.repository }}" --json body --jq '.body // \"\"')"

          if [[ -z "$release_body" ]]; then
            release_body="Automated upload from GitHub release $tag."
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "release_url=$release_url"
            echo "release_body<<EOF"
            printf '%s\n' "$release_body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Download packaged release asset
        id: asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p release-assets

          gh release download "${{ steps.release.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir release-assets \
            --pattern "BetterModMenu_v*.zip"

          asset_path="$(find release-assets -maxdepth 1 -type f -name 'BetterModMenu_v*.zip' ! -name '*_cloud.zip' | sort | head -n 1)"
          if [[ -z "$asset_path" ]]; then
            echo "Expected default BetterModMenu_v*.zip release asset was not found." >&2
            echo "Cloud-capable *_cloud.zip assets are optional sidecars and are not uploaded as the main Nexus file." >&2
            exit 1
          fi

          cloud_asset_count="$(find release-assets -maxdepth 1 -type f -name 'BetterModMenu_v*_cloud.zip' | wc -l | tr -d ' ')"
          echo "path=$asset_path" >> "$GITHUB_OUTPUT"
          echo "cloud_asset_count=$cloud_asset_count" >> "$GITHUB_OUTPUT"

      - name: Upload release asset to Nexus Mods
        id: nexus
        uses: Nexus-Mods/upload-action@d0321c96e04e91da2caf74cad0c8824f4c748f99
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_group_id: ${{ vars.NEXUSMODS_FILE_GROUP_ID }}
          filename: ${{ steps.asset.outputs.path }}
          version: ${{ steps.release.outputs.version }}
          display_name: Better Mod Menu ${{ steps.release.outputs.version }}
          description: ${{ steps.release.outputs.release_body }}
          file_category: main

      - name: Summarize upload
        shell: bash
        run: |
          {
            echo "## Nexus Mods upload"
            echo
            echo "- Tag: \`${{ steps.release.outputs.tag }}\`"
            echo "- Version: \`${{ steps.release.outputs.version }}\`"
            echo "- File group ID: \`${{ vars.NEXUSMODS_FILE_GROUP_ID }}\`"
            echo "- Uploaded asset: \`${{ steps.asset.outputs.path }}\`"
            echo "- Optional cloud assets found: \`${{ steps.asset.outputs.cloud_asset_count }}\`"
            echo "- Uploaded file UID: \`${{ steps.nexus.outputs.file_uid }}\`"
            echo "- Release source: ${{ steps.release.outputs.release_url }}"
            echo "- Nexus file description source: GitHub release body"
          } >> "$GITHUB_STEP_SUMMARY"
